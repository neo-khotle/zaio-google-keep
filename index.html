<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    
        <title>Google Keep</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

</head>
<body>
    
    <nav>
        <header> 
            <!-- logo -->
            <section class="logo-area">
                <i class="material-symbols-outlined hover" id="menu-btn">menu</i>
                <img src="https://www.gstatic.com/images/branding/productlogos/keep_2026/v2/web-48dp/logo_keep_2026_color_1x_web_48dp.png" alt="Logo">
                <span class="logo-text">Keep</span>

                <div class="search-area">
                <!-- search area -->
                <i class="material-symbols-outlined hover">Search</i>
                <input type="search" placeholder="search">
                </div>
            </section>

            <section class="settings-area">
                <div > 
                    <i class="material-symbols-outlined hover"> refresh </i>
                </div>
                <div > 
                    <i class="material-symbols-outlined hover"> view_agenda </i>                   
                </div>
                <div > 
                    <i class="material-symbols-outlined hover"> settings </i>                    
                </div>
                <div > 
                    <i class="material-symbols-outlined hover"> apps </i>                    
                </div>
            <!-- </section> -->

            <!-- <section class="profile-area"> -->
                <i class="material-symbols-outlined hover"> account_circle</i>
            </section>
        </header>
    </nav>


    <!-- sidebar -->
    <aside>
        <div class="sidebar expanded"> 
            <div class="sidebar-items active-item" id="notes-sidebar">
                <span class="material-symbols-outlined hover" > Lightbulb </span>
                <span class="sidebar-text">Notes</span>
            </div>
            <div class="sidebar-items">
                <span class="material-symbols-outlined hover"> Notifications </span>
                <span class="sidebar-text">Reminders</span>
            </div>
            <div class="sidebar-items">
                <span class="material-symbols-outlined hover"> Edit </span>
                <span class="sidebar-text">Edit Labels</span>
            </div>
            <div class="sidebar-items" id="archive-sidebar">
                <span class="material-symbols-outlined hover" id="archive-note-btn"> Archive </span>
                <span class="sidebar-text">Archive</span>
            </div>
            <div class="sidebar-items">
                <span class="material-symbols-outlined hover"> Delete </span>
                <span class="sidebar-text">Trash</span>
            </div>
        </div>
    </aside>

    <!-- notes sections -->
    <main>    
        
        <!--inactive form container-->
        <div class="form-container inActive-form" onclick="openActiveForm()">
            <form class="form" id="form">
                <input type="text" placeholder="Make a note" class="note-title"/>

                
                <div class="form-actions">
                    <div>
                        <span class="material-symbols-outlined hover"> check_box </span>
                    </div>
                    <div>
                        <span class="material-symbols-outlined hover"> brush</span>
                    </div>
                    <div>
                        <span class="material-symbols-outlined hover"> image </span>
                    </div>
                
                </div>
            
            </form>

        </div>

        <!--active form container-->
        <div class="form-container active-form"> 
            
            <form class="notes" id="note-form"> 
                <input type="text" id="title" placeholder="Title">
                <textarea id="note" placeholder="Take a note..."></textarea>
                

            <div class="form-actions">
                        <div class="icons">
                            <div>
                                <span class="material-symbols-outlined hover"> text_format </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover"> add_alert </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover"> palette </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover"> person_add </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover"> image </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover" id="archive-note-btn"> archive </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover"> more_vert </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover"> undo </span>
                            </div>
                            <div>
                                <span class="material-symbols-outlined hover"> redo </span>
                            </div>
                        </div>

                        <button class="close-btn" onclick="saveNote(event)">Close</button>
                    </div>
            </form>
        </div>
               
             
        <!-- Active Notes Container -->
        <div id="notes" class="view-section"></div>

        <!-- Archived Notes Container (Hidden by default) -->
        <div id="archived-notes" class="view-section" style="display: none;"></div>
    </main>



    <script src="script.js" type="text/javascript"></script>
</body>
</html>
