<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    
        <title>Google Keep</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>

    <main>
        <header>
            <!--navbar section-->
            <div class="navbar">

                <div class="logo">
                    <i class="material-icons">menu</i>
                    <img src="https://www.gstatic.com/images/branding/productlogos/keep_2026/v2/web-48dp/logo_keep_2026_color_1x_web_48dp.png" srcset="https://www.gstatic.com/images/branding/productlogos/keep_2026/v2/web-48dp/logo_keep_2026_color_1x_web_48dp.png 1x, https://www.gstatic.com/images/branding/productlogos/keep_2026/v2/web-48dp/logo_keep_2026_color_2x_web_48dp.png 2x " alt="logo" aria-hidden="true" role="presentation" style="width:40px;height:40px">
                    <span>Keep</span>
                </div>

                <div class="searchbar">
                    <form class="search">
                        <button><i class="material-icons">search</i></button>  <!-- looking glass -->
                        <input type="text" placeholder="Search" name="search"/>
                    </form>
                </div>
            </div>

        </header>
        
        <!--new note section-->
        <div> 
            <input type="text" id="title" placeholder="Title">
            <textarea id="note" placeholder="Take a note..."></textarea>
            <button onclick="saveNote()">Close</button>
        </div>

        <section id="notes">
            
        </section>
        
        <!--sidebar section-->
        <section id="sidebar">
            <div class="categories-section">
                
                <span class="category">
                    <i class="material-icons">account_box</i>
                    Notes
                </span>
                <span class="category">
                    <i class="material-icons">history</i>
                    Reminders
                </span>
                <span class="category">
                    <i class="material-icons">account_box</i>
                    Edit Labels
                </span>
                <span class="category">
                    <i class="material-icons">account_box</i>
                    Archive
                </span>
                <span class="category">
                    <i class="material-icons">account_box</i>
                    Trash
                </span>

            </div>
        </section>

    </main>

    <script src="script.js" type="text/javascript"></script>
</body>
</html>
